# Intentionally insecure sample - open this file with the extension running (F5).
server.port=8080
server.ssl.enabled=false
server.error.include-stacktrace=always
server.error.include-message=on_param
server.servlet.session.cookie.http-only=false

spring.datasource.url=jdbc:mysql://db.internal:3306/app?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true

jwt.secret=${JWT_SECRET:dev-only-secret}
aws.access-key-id=AKIAABCDEFGHIJKLMNOP
eureka.client.service-url.defaultZone=http://eureka.corp.example:8761/eureka

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
logging.level.root=DEBUG
debug=true
